<script>
/* ============================================================
   CONFIG & STATE
   ============================================================ */
const CONFIG = {

  ownerName: 'Aarav Sharma',

  ownerTagline: 'I design and build fast, accessible, beautiful digital products.',
  tagline: 'Crafting digital experiences, one project at a time.',

  syncKey: 'devfolio_super_secret_key_change_me_2025',
  apiBase: '/api/sync',
  pollInterval: 8000,
  saltPrefix: 'devfolio$v1$',
  upiId: 'aarav@upi',
  upiName: 'Aarav Sharma',
  currency: '₹',
  debug: false,
};

const K_ = {
  session: 'devfolio_session',
  state: 'devfolio_state_cache',
  lastSync: 'devfolio_last_sync',
};

function log(...args) { if (CONFIG.debug) console.log('[DevFolio]', ...args); }

let APP = {
  users: [], inquiries: [], projects: [], achievements: [],
  skills: [], services: [], orders: [], payments: [],
  expenses: [], notifications: [], announcements: [], testimonials: [],
  meta: { version: 1, updatedAt: null },
};

let currentUser = null;
let pollTimer = null;
let lastServerSnapshot = '';

/* ============================================================
   CRYPTO
   ============================================================ */
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}
async function hashPassword(password, saltKey) {
  return sha256((saltKey || CONFIG.saltPrefix) + password);
}
async function verifyPassword(password, storedHash) {
  const salts = [CONFIG.saltPrefix, 'devfolio$v1$', 'devfolio$', ''];
  for (const salt of salts) {
    const attempt = await sha256(salt + password);
    if (attempt === storedHash) return true;
  }
  return false;
}
function isHashed(str) { return typeof str === 'string' && /^[a-f0-9]{64}$/.test(str); }

/* ============================================================
   SYNC
   ============================================================ */
async function syncPull() {
  try {
    const res = await fetch(CONFIG.apiBase, { method: 'GET', headers: { 'X-Api-Key': CONFIG.syncKey } });
    if (!res.ok) throw new Error('Pull failed: ' + res.status);
    const json = await res.json();
    return json.data || {};
  } catch (err) { log('Sync pull failed', err); return null; }
}
async function syncPush() {
  try {
    const res = await fetch(CONFIG.apiBase, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': CONFIG.syncKey },
      body: JSON.stringify({ data: APP }),
    });
    if (!res.ok) throw new Error('Push failed: ' + res.status);
    localStorage.setItem(K_.lastSync, Date.now().toString());
    return true;
  } catch (err) { log('Sync push failed', err); return false; }
}
function saveLocal() {
  try { localStorage.setItem(K_.state, JSON.stringify(APP)); } catch (e) { log('local save failed', e); }
}
function loadLocal() {
  try { const raw = localStorage.getItem(K_.state); if (raw) return JSON.parse(raw); } catch (e) { log('local load failed', e); }
  return null;
}
let saveTimer = null;
function save() {
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { syncPush(); }, 600);
}

/* ============================================================
   DEFAULT CONTENT
   ============================================================ */
const DEFAULT_PROJECTS = [
  { id: 'p1', title: 'Nova Analytics', emoji: '📊', description: 'Real-time analytics dashboard with customizable widgets and drill-down reporting.', tech: ['React', 'Node.js', 'PostgreSQL', 'WebSockets'], demoUrl: '#', codeUrl: '#' },
  { id: 'p2', title: 'Splitr — Bill Splitter', emoji: '💸', description: 'Mobile-first expense splitter with UPI deep-linking and offline support.', tech: ['Vanilla JS', 'PWA', 'IndexedDB', 'UPI'], demoUrl: '#', codeUrl: '#' },
  { id: 'p3', title: 'Terra — CMS', emoji: '🌱', description: 'Headless CMS for small business sites with markdown content and image CDN.', tech: ['Next.js', 'Prisma', 'Vercel', 'Cloudinary'], demoUrl: '#', codeUrl: '#' },
  { id: 'p4', title: 'Pulse Fitness Tracker', emoji: '❤️', description: 'Health tracker that syncs with wearables and visualizes trends over time.', tech: ['Flutter', 'Firebase', 'Chart.js'], demoUrl: '#', codeUrl: '#' },
];
const DEFAULT_ACHIEVEMENTS = [
  { id: 'a1', year: '2024', icon: '🥇', title: 'Winner — National Hackathon 2024', description: 'First place out of 240 teams for a real-time collaboration tool.' },
  { id: 'a2', year: '2024', icon: '📜', title: 'AWS Solutions Architect Associate', description: 'Certified in designing distributed systems on AWS.' },
  { id: 'a3', year: '2023', icon: '🚀', title: 'Shipped 20+ Production Apps', description: 'Full-stack apps used by over 100k combined active users.' },
  { id: 'a4', year: '2022', icon: '🎓', title: 'B.Tech Computer Science — Gold Medalist', description: 'Ranked 1st in department, graduated with distinction.' },
];
const DEFAULT_SKILLS = [
  { id: 's1', category: 'Frontend', skills: ['HTML5', 'CSS3', 'JavaScript', 'React', 'Next.js', 'Tailwind CSS'] },
  { id: 's2', category: 'Backend', skills: ['Node.js', 'Express', 'Prisma', 'PostgreSQL', 'MongoDB', 'REST APIs'] },
  { id: 's3', category: 'Tools & Cloud', skills: ['Git', 'GitHub Actions', 'Vercel', 'Docker', 'AWS', 'Figma'] },
];
const DEFAULT_SERVICES = [
  { id: 'sv1', emoji: '💡', name: 'Technical Consultation', description: '45-minute call to discuss your product or architecture.', mrp: 2000, price: 999, unit: 'session' },
  { id: 'sv2', emoji: '🔍', name: 'Code Review', description: 'Detailed code review of your repo with written feedback.', mrp: 5000, price: 2999, unit: 'repo' },
  { id: 'sv3', emoji: '🚀', name: 'Landing Page Build', description: 'High-converting responsive landing page, delivered in 5 days.', mrp: 30000, price: 19999, unit: 'project' },
  { id: 'sv4', emoji: '📚', name: 'Mentorship Session', description: '1-hour personalised mentoring for aspiring developers.', mrp: 3000, price: 1499, unit: 'session' },
];
const DEFAULT_TESTIMONIALS = [
  { id: 't1', author: 'Priya Nair', role: 'Founder, Terra Labs', text: 'Delivered our MVP two weeks early and it just works. Rare mix of speed and quality.' },
  { id: 't2', author: 'Rahul Verma', role: 'CTO, Nova Analytics', text: 'Clean architecture, thoughtful APIs, and great documentation. Would hire again in a heartbeat.' },
];

function seedPortfolioContent() {
  if (!APP.projects?.length) APP.projects = [...DEFAULT_PROJECTS];
  if (!APP.achievements?.length) APP.achievements = [...DEFAULT_ACHIEVEMENTS];
  if (!APP.skills?.length) APP.skills = [...DEFAULT_SKILLS];
  if (!APP.services?.length) APP.services = [...DEFAULT_SERVICES];
  if (!APP.testimonials?.length) APP.testimonials = [...DEFAULT_TESTIMONIALS];
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  const cached = loadLocal();
  if (cached) APP = { ...APP, ...cached };

  const remote = await syncPull();
  if (remote && Object.keys(remote).length > 0) {
    APP = { ...APP, ...remote };
    lastServerSnapshot = JSON.stringify(APP);
  }

  if (!APP.users || APP.users.length === 0) await seedOwner();

  ['users','inquiries','projects','achievements','skills','services','orders','payments','expenses','notifications','announcements','testimonials']
    .forEach((k) => { if (!Array.isArray(APP[k])) APP[k] = []; });

  seedPortfolioContent();
  saveLocal();

  const session = localStorage.getItem(K_.session);
  if (session) {
    const user = APP.users.find((u) => u.username === session);
    if (user) {
      currentUser = user;
      renderApp();
      if (user.role === 'owner') startPolling();
      return;
    }
  }
  renderPublic();
}

async function seedOwner() {
  const hash = await hashPassword('owner123');
  APP.users = [{
    id: 'owner-' + Date.now(), username: 'owner', passwordHash: hash,
    name: CONFIG.ownerName, role: 'owner', email: CONFIG.email, phone: '',
    companyName: 'DevFolio', membershipStatus: 'active',
    joinedAt: new Date().toISOString(), points: 0, avatarData: null,
  }];
  await syncPush();
}

/* ============================================================
   POLLING
   ============================================================ */
function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    const remote = await syncPull();
    if (!remote) return;
    const snap = JSON.stringify(remote);
    if (snap !== lastServerSnapshot) {
      lastServerSnapshot = snap;
      APP = { ...APP, ...remote };
      saveLocal();
      if (currentUser?.role === 'owner') renderOwnerDashboard();
      showToast('Data refreshed from cloud', 'info');
    }
  }, CONFIG.pollInterval);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ============================================================
   AUTH
   ============================================================ */
async function handleLogin(username, password) {
  const user = APP.users.find((u) => u.username === username);
  if (!user) return { ok: false, msg: 'Account not found' };
  if (!isHashed(user.passwordHash)) {
    if (user.passwordHash === password) {
      user.passwordHash = await hashPassword(password);
      save();
      return { ok: true, user };
    }
    return { ok: false, msg: 'Invalid password' };
  }
  const valid = await verifyPassword(password, user.passwordHash);
  if (!valid) return { ok: false, msg: 'Invalid password' };
  return { ok: true, user };
}

async function handleRegister(data) {
  if (APP.users.find((u) => u.username === data.username)) return { ok: false, msg: 'Username already taken' };
  const hash = await hashPassword(data.password);
  const user = {
    id: 'user-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    username: data.username, passwordHash: hash, name: data.name, role: 'client',
    email: data.email || '', phone: data.phone || '', companyName: data.companyName || '',
    budgetRange: data.budgetRange || '', membershipStatus: 'active',
    joinedAt: new Date().toISOString(), points: 0, avatarData: null,
  };
  APP.users.push(user);
  save();
  return { ok: true, user };
}

function logout() {
  localStorage.removeItem(K_.session);
  currentUser = null;
  stopPolling();
  renderPublic();
}

/* ============================================================

   ============================================================ */

  { id: 'points_100', icon: '🌟', name: 'Rising Star', desc: 'Earned 100 points', check: (s) => s.points >= 100 },

  { id: 'referral', icon: '🤝', name: 'Referrer', desc: 'Referred a friend', check: (s) => s.referrals >= 1 },
  { id: 'loyal_6mo', icon: '🏆', name: 'Long-Term Partner', desc: '6+ months with us', check: (s) => s.monthsActive >= 6 },
  { id: 'profile_complete', icon: '✅', name: 'Complete Profile', desc: 'Filled all profile fields', check: (s) => s.profileComplete },
];

function computeClientStats(user) {
  const inquiries = APP.inquiries.filter((i) => i.userId === user.id).length;
  const orders = APP.orders.filter((o) => o.userId === user.id).length;
  const payments = APP.payments.filter((p) => p.userId === user.id && p.status === 'approved').length;
  const spent = APP.payments.filter((p) => p.userId === user.id && p.status === 'approved').reduce((sum, p) => sum + Number(p.amount || 0), 0);
  const testimonials = APP.testimonials.filter((t) => t.userId === user.id).length;
  const monthsActive = user.joinedAt ? Math.max(0, Math.floor((Date.now() - new Date(user.joinedAt).getTime()) / (30 * 24 * 60 * 60 * 1000))) : 0;
  const profileComplete = !!(user.name && user.email && user.phone && user.companyName);
  return { inquiries, orders, payments, spent, testimonials, referrals: 0, monthsActive, profileComplete, points: user.points || 0 };
}
function getClientBadges(user) {
  const s = computeClientStats(user);
  return CLIENT_BADGES.map((b) => ({ ...b, unlocked: b.check(s) }));
}

/* ============================================================
   UPI / QR
   ============================================================ */
function buildUpiLink(amount, note, ref) {
  const params = new URLSearchParams({ pa: CONFIG.upiId, pn: CONFIG.upiName, cu: 'INR', am: amount.toString(), tn: note || 'Service payment', tr: ref || 'DF' + Date.now() });
  return 'upi://pay?' + params.toString();
}
function renderQr(container, text) {
  container.innerHTML = '';
  if (typeof QRCode === 'undefined') { container.innerHTML = '<p class="text-xs text-muted">QR unavailable</p>'; return; }
  new QRCode(container, { text, width: 150, height: 150, colorDark: '#070b14', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}

/* ============================================================
   UTILITIES
   ============================================================ */
function fmtCurrency(n) { return CONFIG.currency + Number(n || 0).toLocaleString('en-IN'); }
function fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fmtDateTime(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function uid(prefix) { return (prefix || 'id') + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7); }
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

/* ============================================================
   TOAST & MODAL
   ============================================================ */
function showToast(msg, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  const icons = { success: '✅', error: '⚠️', info: 'ℹ️' };
  el.innerHTML = '<span>' + (icons[type] || 'ℹ️') + '</span><span>' + escapeHtml(msg) + '</span>';
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; setTimeout(() => el.remove(), 300); }, 3200);
}
function showModal(html) {
  document.getElementById('modalRoot').innerHTML = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">' + html + '</div></div>';
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

   PUBLIC VIEW

function renderPublic() {

        <div class="grid-3">

          `).join('')}

function submitPublicInquiry(e) {
  e.preventDefault();
  const inquiry = {
    id: uid('inq'), userId: currentUser?.id || null,
    name: document.getElementById('ciName').value.trim(),
    email: document.getElementById('ciEmail').value.trim(),
    subject: document.getElementById('ciSubject').value.trim(),
    message: document.getElementById('ciMessage').value.trim(),
    status: 'new', createdAt: new Date().toISOString(),
  };
  if (!inquiry.name || !inquiry.email || !inquiry.subject || !inquiry.message) { showToast('Please fill all fields', 'error'); return; }
  APP.inquiries.push(inquiry);
  APP.notifications.push({ id: uid('notif'), userId: 'owner', title: 'New inquiry from ' + inquiry.name, body: inquiry.subject, read: false, createdAt: new Date().toISOString() });
  save();
  e.target.reset();
  showToast('Message sent! I will reply soon.', 'success');
}

function switchAuthTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
}

async function onLoginSubmit(e) {
  e.preventDefault();
  const username = document.getElementById('loginUser').value.trim().toLowerCase();
  const password = document.getElementById('loginPass').value;
  const result = await handleLogin(username, password);
  if (!result.ok) { showToast(result.msg, 'error'); return; }
  currentUser = result.user;
  localStorage.setItem(K_.session, currentUser.username);
  showToast('Welcome back, ' + currentUser.name + '!', 'success');
  renderApp();
  if (currentUser.role === 'owner') startPolling();
  const pending = sessionStorage.getItem('pendingService');
  if (pending && currentUser.role === 'client') {
    sessionStorage.removeItem('pendingService');
    setTimeout(() => bookService(pending), 400);
  }
}

async function onRegisterSubmit(e) {
  e.preventDefault();
  const data = {
    name: document.getElementById('regName').value.trim(),
    username: document.getElementById('regUser').value.trim().toLowerCase(),
    email: document.getElementById('regEmail').value.trim(),
    password: document.getElementById('regPass').value,
    phone: document.getElementById('regPhone').value.trim(),
    companyName: document.getElementById('regCompany').value.trim(),
  };
  const result = await handleRegister(data);
  if (!result.ok) { showToast(result.msg, 'error'); return; }
  APP.notifications.push({ id: uid('notif'), userId: result.user.id, title: 'Welcome to ' + CONFIG.brand + '!', body: 'Explore services and book your first consultation.', read: false, createdAt: new Date().toISOString() });
  save();
  currentUser = result.user;
  localStorage.setItem(K_.session, currentUser.username);
  showToast('Account created! Welcome aboard.', 'success');
  renderApp();
}

async function refreshPaymentStatus() {
  showToast('Checking status...', 'info');
  const remote = await syncPull();
  if (remote) {
    APP = { ...APP, ...remote };
    saveLocal();
    currentUser = APP.users.find((u) => u.id === currentUser.id) || currentUser;
  }
  const pending = APP.payments.find((p) => p.userId === currentUser.id && p.status === 'pending');
  if (!pending) { showToast('Payment processed!', 'success'); renderApp(); }
  else showToast('Still pending. Please wait.', 'info');
}

function cancelPendingPayment(paymentId) {
  APP.payments = APP.payments.filter((p) => p.id !== paymentId);
  save();
  showToast('Payment cancelled.', 'info');
  renderApp();
}

function bookService(serviceId) {
  const svc = APP.services.find((s) => s.id === serviceId);
  if (!svc) return;
  closeModal();
  APP.orders.push({
    id: uid('ord'), userId: currentUser.id, userName: currentUser.name,
    serviceId: svc.id, serviceName: svc.name, price: svc.price,
    status: 'pending', createdAt: new Date().toISOString(),
  });
  APP.notifications.push({ id: uid('notif'), userId: 'owner', title: 'New booking', body: currentUser.name + ' booked ' + svc.name, read: false, createdAt: new Date().toISOString() });
  currentUser.points = (currentUser.points || 0) + 25;
  save();
  openPaymentModal(svc);
}

function openPaymentModal(svc) {
  const ref = 'DF' + currentUser.id.slice(-5) + Date.now().toString().slice(-5);
  const upiLink = buildUpiLink(svc.price, svc.name + ' — ' + currentUser.name, ref);

  showModal(`
    <h2 class="mb-2">💳 Complete Payment</h2>
    <p class="text-dim text-sm mb-4">Scan the QR or use the UPI app link.</p>
    <div class="text-center mb-4"><div class="qr-box" id="payQr"></div></div>
    <div class="card-stat mb-4">

function renderRevenueChart() {
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().slice(0, 7);
    const label = d.toLocaleString('en', { month: 'short' });
    const total = APP.payments.filter((p) => p.status === 'approved' && (p.approvedAt || p.createdAt || '').startsWith(key)).reduce((s, p) => s + Number(p.amount || 0), 0);
    months.push({ label, total });
  }
  const max = Math.max(...months.map((m) => m.total), 1);
  const w = 520, h = 180, pad = 30;
  const barW = (w - pad * 2) / months.length - 12;
  const bars = months.map((m, i) => {
    const barH = ((m.total / max) * (h - pad * 2)) || 0;
    const x = pad + i * ((w - pad * 2) / months.length) + 6;
    const y = h - pad - barH;
    return `
      <rect class="chart-bar" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="6" />
      <text class="chart-value" x="${x + barW / 2}" y="${y - 5}">${m.total > 0 ? '₹' + Math.round(m.total / 1000) + 'k' : ''}</text>
      <text class="chart-label" x="${x + barW / 2}" y="${h - 8}">${m.label}</text>
    `;
  }).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;min-width:480px">
      <defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#22d3ee" /></linearGradient></defs>
      ${bars}
    </svg>
  `;
}

function updateOrderStatus(orderId, status) {
  const o = APP.orders.find((x) => x.id === orderId);
  if (!o) return;
  o.status = status;
  APP.notifications.push({ id: uid('notif'), userId: o.userId, title: status === 'in-progress' ? 'Work started! 🚀' : 'Project delivered ✅', body: o.serviceName + ' is ' + status + '.', read: false, createdAt: new Date().toISOString() });
  if (status === 'delivered') {
    const u = APP.users.find((x) => x.id === o.userId);
    if (u) u.points = (u.points || 0) + 50;
  }
  save(); showToast('Order updated', 'success'); renderOwnerDashboard();
}

function approvePayment(paymentId) {
  const p = APP.payments.find((x) => x.id === paymentId);
  if (!p) return;
  p.status = 'approved';
  p.approvedAt = new Date().toISOString();
  const u = APP.users.find((x) => x.id === p.userId);
  if (u) {
    u.points = (u.points || 0) + 25;
    APP.notifications.push({ id: uid('notif'), userId: u.id, title: 'Payment Approved! ✅', body: 'Your booking for ' + (p.serviceName || 'a service') + ' is confirmed.', read: false, createdAt: new Date().toISOString() });
  }
  save(); showToast('Payment approved!', 'success'); renderOwnerDashboard();
}
function rejectPayment(paymentId) {
  const p = APP.payments.find((x) => x.id === paymentId);
  if (!p) return;
  p.status = 'rejected';
  APP.notifications.push({ id: uid('notif'), userId: p.userId, title: 'Payment Rejected', body: 'Please contact ' + CONFIG.email + '.', read: false, createdAt: new Date().toISOString() });
  save(); showToast('Payment rejected.', 'info'); renderOwnerDashboard();

    <h2 class="mb-3">💬 Testimonials</h2>
    <div class="mb-4">
      ${APP.testimonials.map((t) => `
        <div class="flex justify-between items-center mb-2 card-stat">
          <div>
            <strong style="font-size:0.9rem">${escapeHtml(t.author)}</strong>
            <div class="text-xs text-muted">${escapeHtml(t.role || 'Client')}</div>
            <div class="text-xs text-dim mt-1" style="max-width:340px">${escapeHtml(t.text)}</div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="deleteTestimonial('${t.id}')">Delete</button>
        </div>
      `).join('') || '<p class="text-muted text-sm mb-4">No testimonials yet.</p>'}
    </div>
    <h3 class="text-sm mb-2">Add testimonial</h3>
    <div class="field"><label>Author name</label><input id="ntAuthor" placeholder="Jane Doe" /></div>
    <div class="field"><label>Role / company</label><input id="ntRole" placeholder="Founder, Acme Inc." /></div>
    <div class="field"><label>Testimonial text</label><textarea id="ntText" placeholder="What was it like working together?"></textarea></div>
    <button class="btn btn-primary btn-block" onclick="addTestimonial()">Add</button>
    <button class="btn btn-ghost btn-block mt-2" onclick="showManageContent()">← Back</button>
  `);
}
function addTestimonial() {
  const author = document.getElementById('ntAuthor').value.trim();
  const role = document.getElementById('ntRole').value.trim();
  const text = document.getElementById('ntText').value.trim();
  if (!author || !text) { showToast('Author and text required', 'error'); return; }
  APP.testimonials.push({ id: uid('test'), author, role: role || 'Client', text, createdAt: new Date().toISOString() });
  save(); showToast('Testimonial added!', 'success'); showEditTestimonials();
}
function deleteTestimonial(id) {
  APP.testimonials = APP.testimonials.filter((t) => t.id !== id);
  save(); showEditTestimonials();
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function showNotifications() {
  const mine = APP.notifications.filter((n) => n.userId === currentUser.id).reverse();
  showModal(`
    <h2 class="mb-4">🔔 Notifications</h2>
    ${mine.length ? mine.map((n) => `
      <div class="card mb-2" style="padding:1rem">
        <div class="flex justify-between items-center">
          <strong style="font-size:0.9rem">${escapeHtml(n.title)}</strong>
          ${!n.read ? '<span class="badge badge-violet">New</span>' : ''}
        </div>
        <p class="text-sm text-muted mt-1">${escapeHtml(n.body)}</p>
        <p class="text-xs text-muted mt-1">${fmtDateTime(n.createdAt)}</p>
      </div>
    `).join('') : '<p class="text-muted text-sm">No notifications.</p>'}
    <button class="btn btn-ghost btn-block mt-4" onclick="markAllRead();closeModal()">Mark All Read</button>
  `);
}
function markAllRead() {
  APP.notifications.forEach((n) => { if (n.userId === currentUser.id) n.read = true; });
  save();
  renderApp();
}

/* ============================================================
   PROFILE
   ============================================================ */
function showProfile() {
  showModal(`
    <h2 class="mb-4">👤 My Profile</h2>
    <div class="text-center mb-4">
      <div style="width:80px;height:80px;border-radius:50%;margin:0 auto;background:var(--grad);display:grid;place-items:center;font-size:2rem;overflow:hidden">
        ${currentUser.avatarData ? `<img src="${currentUser.avatarData}" style="width:100%;height:100%;object-fit:cover" />` : '👤'}
      </div>
      <label class="btn btn-ghost btn-sm mt-2" style="cursor:pointer;display:inline-flex">
        📷 Change Photo
        <input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(event)" />
      </label>
    </div>
    <div class="field"><label>Name</label><input type="text" value="${escapeHtml(currentUser.name)}" onchange="updateProfile('name', this.value)" /></div>
    <div class="field"><label>Email</label><input type="email" value="${escapeHtml(currentUser.email || '')}" onchange="updateProfile('email', this.value)" /></div>
    <div class="field"><label>Phone</label><input type="tel" value="${escapeHtml(currentUser.phone || '')}" onchange="updateProfile('phone', this.value)" /></div>
    ${currentUser.role === 'client' ? `<div class="field"><label>Company</label><input type="text" value="${escapeHtml(currentUser.companyName || '')}" onchange="updateProfile('companyName', this.value)" /></div>` : ''}
    <button class="btn btn-primary btn-block" onclick="closeModal();showToast('Profile saved!','success')">Save</button>
  `);
}
function updateProfile(key, value) {
  currentUser[key] = value;
  const idx = APP.users.findIndex((u) => u.id === currentUser.id);
  if (idx >= 0) APP.users[idx] = currentUser;
  save();
}
function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    currentUser.avatarData = e.target.result;
    updateProfile('avatarData', e.target.result);
    showToast('Photo updated!', 'success');
    showProfile();
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   PWA
   ============================================================ */
function setupPwa() {
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="42" fill="#070b14"/><text x="96" y="130" font-size="100" text-anchor="middle" fill="#8b5cf6" font-family="monospace">&lt;/&gt;</text></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);
  const manifest = {
    name: 'DevFolio Portfolio', short_name: 'DevFolio',
    description: 'Full-stack developer portfolio and services',
    start_url: '/', display: 'standalone',
    background_color: '#070b14', theme_color: '#070b14',
    icons: [
      { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
      { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' },
    ],
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestUrl = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = manifestUrl;
  document.head.appendChild(link);
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon'; appleIcon.href = iconUrl;
  document.head.appendChild(appleIcon);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => log('SW registration failed'));
  }
}

/* ============================================================
   START
   ============================================================ */
setupPwa();
boot().catch((err) => {
  console.error('Boot failed:', err);
  document.getElementById('loadingScreen').innerHTML =
    '<div class="text-center"><p class="text-rose">Failed to load. Check your connection.</p>' +
    '<button class="btn btn-ghost mt-4" onclick="location.reload()">Retry</button></div>';
});
</script>
